name: opensign-local

services:
  mysql:
    image: mysql:5.7
    container_name: opensign-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: opensign123
      MYSQL_DATABASE: opensign
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3308:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../kaifangqian-parent/sql/opensign.sql:/docker-entrypoint-initdb.d/01-opensign.sql:ro
      - ./init/opensign-local.sql:/docker-entrypoint-initdb.d/02-opensign-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - opensign

  redis:
    image: redis:6.2.14
    container_name: opensign-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass opensign123
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "opensign123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - opensign

  api:
    build:
      context: ../kaifangqian-parent
      dockerfile: Dockerfile.local
    image: opensign-api-local:latest
    container_name: opensign-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8899:8899"
    volumes:
      - ./data/storage:/app/storage
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: opensign
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: opensign123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: opensign123
      REDIS_DATABASE: 0
      STORAGE_ACTIVE: local
      POWERJOB_WORKER_ENABLED: "false"
      SERVICE_BASE_HOST: http://localhost:8080/resrun-paas
      LOCAL_SIGN_ENABLED: "true"
      LOCAL_SIGN_PFX_PATH: /app/storage/local-sign/opensign-local-sign.pfx
      LOCAL_SIGN_PFX_PASSWORD: OpenSignLocal123!
      YD_APP_ID: QQXKZNAY
      YD_APP_VK: 
    networks:
      - opensign

  web:
    image: registry.cn-beijing.aliyuncs.com/kaifangqian/nginx:v3.2.1
    container_name: opensign-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      API_SERVER_NAME: opensign-api
      DOMAIN_NAME: localhost
    ports:
      - "80:8806"
      - "8080:8806"
    networks:
      - opensign

networks:
  opensign:
    driver: bridge
